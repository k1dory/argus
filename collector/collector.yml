# Конфигурация коллектора ARGUS. Переменные окружения раскрываются (${VAR}).
listeners:
  syslog:
    udp: ":5514"
    tcp: ":5514"          # RFC 6587: octet-counting или по строкам; кадр ≤ 1 МБ
    max_conns: ${SYSLOG_TCP_MAX_CONNS:-1024}          # одновременных TCP/TLS-соединений
    max_conns_per_ip: ${SYSLOG_TCP_MAX_CONNS_PER_IP:-64}   # с одного IP; первый кадр ждём 30 с, дальше 5 мин
    tls:
      addr: "${SYSLOG_TLS_ADDR}"          # RFC 5425, напр. ":6514"; не задан или пуст — выключен (без дефолта:
                                          # иначе прод без SYSLOG_TLS_CERT/KEY падал на старте)
      cert: "${SYSLOG_TLS_CERT}"          # при заданном addr в проде обязательны; самоподписанный — только при ARGUS_DEV=1
      key: "${SYSLOG_TLS_KEY}"
      client_ca: "${SYSLOG_TLS_CLIENT_CA:-}"   # PEM с CA клиентов → mTLS, attrs.peer_cn из сертификата
  netflow:
    udp: ":2055"
    source: netflow.core
    exporters: "${NETFLOW_EXPORTERS:-}"   # allowlist экспортёров: CIDR через запятую; пусто — все
  http:
    addr: ":8088"
    token: "${ARGUS_INGEST_TOKEN}"     # пусто — без проверки (только для стенда)
  # Файлы на хосте (смонтировать в контейнер): WAF ModSecurity/Coraza.
  #   waf-audit — SecAuditLogFormat JSON (ModSecurity v3, Coraza); lines — error-лог
  #   nginx/Apache с «ModSecurity: …» или JSON-лог Caddy с «Coraza: …».
  files:
    - path: "${WAF_AUDIT_LOG:-}"        # напр. /logs/waf/modsec_audit.log (WAF_LOG_DIR → /logs/waf)
      format: waf-audit
      source: waf.modsecurity
      from_start: ${WAF_FROM_START:-false}   # строго true|false — прочитать файл с начала (демо), иначе только новое
    - path: "${WAF_ERROR_LOG:-}"        # напр. /logs/waf/error.log (nginx) или caddy.log (Coraza)
      format: lines
      source: waf.error
      from_start: ${WAF_FROM_START:-false}

# Классификация источников: подстрока в Device Vendor (и Product) → имя и класс.
# Встроенная таблица уже знает Check Point, PAN-OS, UserGate, Ideco, Fortinet,
# Kaspersky, CrowdStrike, Cortex, Sysmon — здесь только переопределения.
sources:
  - vendor: "UserGate"
    name: ngfw.usergate
    class: ngfw
    pii: true          # логи прокси с логинами сотрудников — только on-prem модель

# Поля CEF/LEEF, в которых ищем e-mail и телефоны для флага ПДн.
pii_fields: [suser, duser, usrName, user, request, msg, user.email, email, phone, msisdn]

k8s:
  cluster: prod

batch:
  size: 500
  flush_ms: 100                    # верхняя задержка подтверждения TCP/TLS/file/pull после fsync spool
  pending_rows: ${SINK_PENDING_ROWS:-200000}       # очередь к ClickHouse; при переполнении выбрасывается старое
  pending_bytes: ${SINK_PENDING_BYTES:-536870912}  # та же очередь, потолок по байтам (512 МБ): Raw ≤ 256 КБ на событие

# CrowdStrike Falcon Streaming API (выключен, пока нет client_id)
falcon:
  base_url: "${FALCON_BASE_URL:-https://api.crowdstrike.com}"
  client_id: "${FALCON_CLIENT_ID}"
  client_secret: "${FALCON_CLIENT_SECRET}"
  app_id: argus

# Объектные хранилища: Yandex Cloud Audit Trails (экспорт в Object Storage),
# VK Cloud audit logs (S3-совместимо). Выключены без ключей.
s3:
  - name: cloud.yandex
    endpoint: https://storage.yandexcloud.net
    region: ru-central1
    bucket: "${YC_AUDIT_BUCKET}"
    prefix: "${YC_AUDIT_PREFIX:-}"
    access_key: "${YC_S3_ACCESS_KEY}"
    secret_key: "${YC_S3_SECRET_KEY}"
    format: yandex-audit
    interval: 60s
    state_file: /state/yc-audit.cursor
