# Фрагмент prometheus.yml: метрики коллектора и движка ARGUS (публикуются на 127.0.0.1
# хоста; policyd — /healthz на 8080). /metrics движка требует Bearer METRICS_TOKEN
# (по умолчанию = ENGINE_TOKEN) — положите его в файл, доступный только Prometheus.
# Шиппер отдаёт /metrics и /healthz на 0.0.0.0:9101, но только в internal-сети
# compose `data` (порт на хост не публикуется): Prometheus, подключённый к этой
# сети, скрейпит shipper:9101; снаружи — healthcheck контейнера (docker ps) и логи.
scrape_configs:
  - job_name: argus-collector
    static_configs: [{ targets: ["127.0.0.1:8088"] }]
  - job_name: argus-engine
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/argus-metrics-token
    static_configs: [{ targets: ["127.0.0.1:8090"] }]
  # Раскомментируйте, если Prometheus работает контейнером в сети compose `data`
  # (шиппер есть только при профиле wazuh).
  #- job_name: argus-shipper
  #  static_configs: [{ targets: ["shipper:9101"] }]
