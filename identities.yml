# Паспорт субъекта: персоны и их алиасы с интервалами действия. Движок читает
# файл по IDENTITIES_FILE (compose: /etc/argus/identities.yml) и перечитывает
# при изменении; записи получают source = yaml, пропавшие из файла алиасы
# помечаются удалёнными. Алиасы также приходят событиями identity.alias от
# экспортеров (IdP, VPN-контроллер) и через API консоли — все три источника
# живут в одной таблице argus.identity_aliases.
#
# Алиас действует на событие, если from <= ts < to. Нет from — действует
# всегда; нет to — по сей день. Даты: YYYY-MM-DD или RFC3339 (UTC).
# kind: email | login | uid | ip | host | sid | peer | phone; email/login/host
# приводятся к нижнему регистру, ip — к канонической записи, phone — к E.164
# («+7 (999) 123-45-67» → «+79991234567»: обязателен «+» и 8–15 цифр).
# Номер телефона — actor_name событий OTP-шлюзов и телефонии, как login и uid.
#
# policies — ограничения на алиасы, которые приходят СОБЫТИЯМИ identity.alias
# (source = event:<источник>). Файл и API консоли пишет администратор, к ним
# политики не применяются. Ключ — вид алиаса; вид без политики не ограничен.
#   sources      — глобы допустимых источников событий (сравнение с event:<source>,
#                  префикс event: в глобе необязателен); нет ключа — любой источник,
#                  пустой список [] — событиям алиасы этого вида запрещены.
#   max_open     — не больше одновременно действующих (без to) алиасов вида у персоны.
#   churn        — не больше max новых интервалов вида у персоны за window
#                  (24h, 30d, 2w; считается входящий; граница окна — вне окна).
#   on_violation — flag (записать, note с префиксом policy:<rule>, по умолчанию),
#                  hold (записать с confidence 0.3 и note policy:hold:<rule> — консоль
#                  показывает, но в склейке не участвует), reject (не записывать).
# Каждое нарушение — событие source argus.identity / action identity.policy.violation
# в журнале (actor_name — персона, object — вид:значение, attrs.rule — sources |
# max_open | churn), по нему работают rules/ops/identity-*.yml. Повтор уже
# известного интервала (тот же вид, значение, from) нарушением не считается.
#
# Пример согласован с cmdb.yml (владельцы узлов) и fixtures/events/identity.ndjson.
# История адреса 10.77.0.42, который перешёл от a.sidorov к i.petrov, в файле
# не описана намеренно: её приносят события identity.alias из той же фикстуры
# (так делает VPN-контроллер), а `make demo` сдвигает даты событий к «сейчас».
persons:
  i.petrov:
    display: "Иван Петров"
    kind: person
    team: platform
    aliases:
      - {kind: email, value: i.petrov@example.org}
      - {kind: email, value: i.petrov@corp.local, note: "почта в NGFW (демо-трафик)"}
      - {kind: login, value: ipetrov}
      - {kind: login, value: i.petrov, note: "логин в EDR и NGFW (демо-трафик)"}
      - {kind: uid, value: "oidc:i.petrov", note: "субъект k8s-аудита (демо-трафик)"}
      - {kind: uid, value: "1001", note: "идентификатор в IdP"}
      - {kind: phone, value: "+7 (999) 123-45-67", note: "рабочий, OTP"}
      - {kind: ip, value: 10.77.0.11, note: "ноутбук, постоянный адрес VPN"}
  a.sidorov:
    display: "Алексей Сидоров"
    team: data
    aliases:
      - {kind: email, value: a.sidorov@example.org}
      - {kind: login, value: asidorov}
      - {kind: login, value: a.sidorov, note: "логин в EDR (демо-трафик)"}
      - {kind: uid, value: "1002"}
      - {kind: ip, value: 10.77.0.23, confidence: 0.9, note: "новый ноутбук, VPN"}
  # Сервисные учётки из демо-трафика: вид service, чтобы они не висели в списке
  # «не привязанных» и чтобы паспорт показывал, что делает учётка, а не человек.
  svc-backup:
    display: "svc-backup (резервное копирование)"
    kind: service
    team: infra
    aliases:
      - {kind: login, value: svc-backup}
  project-7-bot:
    display: "project_7_bot (бот CI проекта 7)"
    kind: service
    team: platform
    aliases:
      - {kind: login, value: project_7_bot}
  s.ivanova:
    display: "Светлана Иванова"
    team: infra
    aliases:
      - {kind: email, value: s.ivanova@example.org}
      - {kind: login, value: sivanova}
      - {kind: uid, value: "1003"}
      - {kind: ip, value: 10.77.0.31}

# Пределы согласованы с fixtures/events/identity.ndjson: у i.petrov три открытых
# ip (10.77.0.11 из файла и из события — разные from — и 10.77.0.42), поэтому
# max_open для ip — 3. Нарушения демонстрирует fixtures/events/identity-policy.ndjson.
policies:
  ip:    { sources: ["event:vpn.*"], max_open: 3, churn: { max: 20, window: 24h }, on_violation: flag }
  host:  { sources: ["event:mdm.*"], max_open: 1, churn: { max: 1, window: 30d }, on_violation: hold }
  email: { sources: ["event:idp.*"], churn: { max: 1, window: 90d }, on_violation: reject }
  phone: { sources: ["event:idp.*", "event:otp.*"], max_open: 2, on_violation: flag }
