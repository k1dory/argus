# ServiceAccount получил cluster-admin
title: Kubernetes RBAC escalation to cluster-admin
id: a41c-k8s-011
level: high
tags: [attack.privilege_escalation, attack.t1078.004]

detection:
  selection:
    event.action|startswith: k8s.create.clusterrolebindings
    attrs.role_ref: cluster-admin
    outcome: success
  condition: selection

analyst:
  profile: on-prem-strict
