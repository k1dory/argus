# Сбой хранилища NAS: журнал событий QNAP (Storage & Snapshots, диски, RAID,
# S.M.A.R.T.) с уровнем warning и выше — ошибка носителя, деградация массива,
# начатая перестройка. Инцидент по первому же событию: дежурный должен знать о
# деградации до того, как откажет второй диск. Субъект у этих событий всегда
# System, поэтому склейка — по NAS и тексту события (в нём номер диска или массива):
# сбой другого NAS или другого диска — свой инцидент и своё уведомление, повтор
# того же сообщения в течение суток схлопывается в прежний.
title: "Ops: NAS storage failure"
id: a41c-ops-065
level: high
tags: [ops.storage, ops.hardware]

detection:
  selection:
    source: nas.qnap
    action: storage.event
    outcome: failure
  condition: selection
  group_by: node, object

dedupe: 24h

analyst:
  profile: on-prem-strict
