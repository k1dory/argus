# Часы источника ушли вперёд: коллектор получил события с ts дальше
# COLLECTOR_CLOCK_SKEW_MAX (10m) в будущем, заменил ts временем приёма (исходное —
# в attrs.ts_original) и раз в минуту сообщает о таком отправителе событием
# collector.clock_skew (value — наибольшее расхождение в секундах). Данные не
# теряются, но время у них приблизительное, а корреляция с другими источниками
# сдвигается — это сигнал эксплуатации, а не ИБ.
#
# Что делать: если источник шлёт syslog RFC 3164 (без часового пояса в метке
# времени) — задать пояс отправителя в SYSLOG_PEER_TZ (адрес=пояс, например
# 192.168.0.59=Europe/Moscow); иначе настроить NTP на самом устройстве.
#
# Склейка по отправителю (attrs.peer): пока часы не исправлены, сообщения идут
# каждую минуту и за сутки схлопываются в один инцидент на устройство. Событие
# пишет сам коллектор с attrs.transport: internal — снаружи это поле
# перезаписывает приём, подделать сработку через ingest нельзя.
title: "Ops: source clock is ahead of the collector"
id: a41c-ops-067
level: low
tags: [argus.system, ops.ingest, ops.time]

detection:
  selection:
    source: argus.collector
    action: collector.clock_skew
    attrs.transport: internal
  condition: selection
  group_by: attrs.peer

dedupe: 24h

analyst:
  profile: mock             # разбор не нужен: RFC 3164 без пояса → SYSLOG_PEER_TZ; иначе NTP на устройстве
