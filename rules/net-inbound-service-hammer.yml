# Долбёжка в один сервис: много попыток соединения снаружи к портам управления и
# баз данных за короткое время — подбор пароля или перебор на уровне соединений.
# Один адрес и один порт: это не скан, это цель.
title: "Network: inbound hammering of admin/database ports"
id: a41c-net-072
level: low
tags: [attack.credential_access, attack.t1110]

detection:
  selection:
    source.class: netflow
    attrs.scope: inbound
    attrs.syn_only: "1"
    dst.port: [22, 2202, 2222, 23, 3389, 5900, 445, 1433, 3306, 5432, 6379, 27017, 8006, 8007, 8443, 9200]
  threshold:
    kind: count
    count: 60
    window: 10m
    group_by: src.ip
  condition: selection and threshold

# Фон интернета: сотни сканеров в сутки. Без новых событий два часа — закрывается
# автоматикой; повтор с той же подсети заводит новый инцидент.
auto_close: 2h

# Сканеры приходят с соседних адресов, а скан портов, обход хостов и долбёжка
# одного адреса идут парой: инцидент — один на подсеть (/24, IPv6 /48) для всей
# группы inbound-scan. Порог считается на адрес, блокируется каждый адрес по
# своему правилу, не больше block_cap новых адресов инцидента за окно.
collapse:
  by: src.net
  group: inbound-scan
  block_cap: 32
  block_cap_window: 1h

analyst:
  profile: on-prem-strict
