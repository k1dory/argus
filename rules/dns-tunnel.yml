# Много крупных DNS-запросов с одного адреса за короткое время — по журналу DNS
# с именами запросов (резолвер, NGFW, прокси DNS), где видно, что это действительно DNS.
title: Possible DNS tunnel
id: a41c-c2-015
level: high
tags: [attack.command_and_control, attack.t1071.004]

# Только исходящий DNS (attrs.scope outbound): запросы к своим резолверам и форвардеру на
# шлюзе — internal, под правило не попадают; туннель идёт на внешний сервер напрямую.
# NetFlow сюда не входит: по потоку имени запроса не видно, а порог «> 200 байт»
# превышает любой DNS по TCP (рукопожатие и заголовки). Трафик на порт 53, который
# не похож на DNS по размеру пакетов, ловит правило port53-non-dns.
detection:
  selection:
    dst.port: 53
    attrs.scope: outbound
    source.class: 'not netflow'
    bytes: '> 200'
  threshold:
    count: 40
    window: 5m
    group_by: src.ip
  condition: selection and threshold

analyst:
  profile: on-prem-strict
