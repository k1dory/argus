# Обход адресов: один внешний адрес пробует один и тот же порт (или несколько) на
# десятках наших хостов — поиск открытого сервиса по всему блоку.
title: "Network: inbound host sweep"
id: a41c-net-071
level: medium
tags: [attack.reconnaissance, attack.t1595.001]

detection:
  selection:
    source.class: netflow
    attrs.scope: inbound
    attrs.syn_only: "1"
  threshold:
    kind: distinct
    field: dst.ip
    distinct: 20
    window: 10m
    group_by: src.ip
  condition: selection and threshold

# Фон интернета: сотни сканеров в сутки. Без новых событий два часа — закрывается
# автоматикой; повтор с того же адреса заводит новый инцидент.
auto_close: 2h

respond:
  action: block_ip
  target: src.ip
  min_level: medium
  ttl: 12h

analyst:
  profile: on-prem-strict
