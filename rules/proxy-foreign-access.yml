# Обращения к публикациям не из ожидаемой страны. Порог низкий, уровень low: это не атака,
# а сигнал «кто-то не из нашей географии ходит в сервис, который открыт всему интернету».
# Страна — ISO 3166-1 alpha-2 из геолокации прокси; ожидаемую подставить под свой контур.
# Техники ATT&CK нет: география, отказ или 200 на общедоступной странице не говорят ни о
# скане (T1595), ни об учётной записи (T1078). Успешный вход пользователя из чужой страны —
# отдельное правило proxy-foreign-account (a41c-net-077, T1078).
title: "Proxy: access to a published service from outside the expected country"
id: a41c-net-076
level: low
tags: [argus.geo]

detection:
  selection:
    action: proxy.access
    attrs.country: 'not RU'
    # Без страны (Caddy, прокси без геолокации) — не «чужая страна», а неизвестно: не считаем.
    attrs.country|regex: '^[A-Za-z]{2}$'
  threshold:
    kind: count
    count: 5
    window: 1h
    group_by: src.ip
  condition: selection and threshold

analyst:
  profile: on-prem-strict
