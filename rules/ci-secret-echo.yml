# Секрет напечатан в логе джоба: TOKEN=..., SECRET=..., PASSWORD=...
title: CI job echoed a secret
id: a41c-cicd-007
level: high
tags: [attack.credential_access, attack.t1552.004]

detection:
  selection:
    source.class: cicd
    attrs.log|regex: '(?i)(token|secret|password|api_key)=[^\s*]{8,}'
  condition: selection

# Имя секрета (object + attrs.secret_id) только НАХОДИТ инцидент: ротация/отзыв того же имени
# в том же проекте позже последней утечки. attrs.secret_id ставит коллектор
# (collector/internal/parse/secrets.go): у утечки — имя переменной из лога
# (REGISTRY_TOKEN=… → REGISTRY_TOKEN), у ротации/отзыва GitLab — имя токена (target_details).
# Имя выбирает пользователь, поэтому ЗАКРЫВАЕТ автоматикой только отзыв (*_revoked, не
# *_rotated: при ротации GitLab заводит новый токен, какой id в событии — не гарантировано)
# доказанно того же токена: тот же неизменяемый attrs.token_id, тот же провайдер
# (vendor/product) и экземпляр (attrs.instance), событие из аудита (source *.audit).
# Утечка из лога CI знает только имя переменной — связи с токеном нет, и такой инцидент по
# ротации или отзыву НЕ закрывается: эскалация с пометкой «закрыт автоматикой, нужна
# проверка» (тег argus.needs_review), закрывает человек. Это осознанное решение:
# однофамилец любого возраста иначе закрыл бы утечку действующего секрета.
# Тишина не доказывает отзыв: через 4 часа без событий инцидент эскалируется, а не закрывается.
close_on:
  source.class: cicd
  event.action|contains: [token_rotated, token_revoked, secret_rotated, secret_revoked]
close_match: [object, attrs.secret_id]
auto_close: 4h
auto_close_action: escalate

analyst:
  profile: on-prem-strict
  redact: [user.email]
