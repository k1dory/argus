# Маячок C2: ровные интервалы обращений к внешнему адресу при малом объёме.
title: Periodic beacon to external host
id: a41c-c2-016
level: low
tags: [attack.command_and_control, attack.t1071.001]

# Только исходящие потоки (attrs.scope ставит коллектор по INTERNAL_NETS): без этого
# правило ловило внешние сканеры, стучащие в наши адреса с ровным интервалом.
detection:
  selection:
    source.class: netflow
    attrs.scope: outbound
    bytes: '< 65536'
  filter:                      # резолверы и время — ровные интервалы по природе
    dst.port: [53, 123]
  threshold:
    kind: periodic
    count: 6
    window: 45m
    group_by: src.ip
    jitter: 0.05
  condition: selection and not filter and threshold

analyst:
  profile: on-prem-strict
