# Скан портов снаружи: один внешний адрес стучится в десятки портов наших адресов
# (SYN без ответа). Источник — NetFlow с границы; attrs.scope/syn_only ставит коллектор
# (INTERNAL_NETS). Ответный трафик (DNS, CDN) под правило не попадает: у него ACK.
title: "Network: inbound port scan"
id: a41c-net-070
level: medium
tags: [attack.reconnaissance, attack.t1046]

detection:
  selection:
    source.class: netflow
    attrs.scope: inbound
    attrs.syn_only: "1"
  threshold:
    kind: distinct
    field: dst.port
    distinct: 50
    window: 10m
    group_by: src.ip
  condition: selection and threshold

# Фон интернета: сотни сканеров в сутки. Без новых событий два часа — закрывается
# автоматикой; повтор с той же подсети заводит новый инцидент.
auto_close: 2h

# Сканеры приходят с соседних адресов, а скан портов, обход хостов и долбёжка
# одного адреса идут парой: инцидент — один на подсеть (/24, IPv6 /48) для всей
# группы inbound-scan. Порог считается на адрес, блокируется каждый адрес по
# своему правилу — как отдельный инцидент.
collapse:
  by: src.net
  group: inbound-scan

respond:
  action: block_ip
  target: src.ip
  min_level: medium
  ttl: 12h

analyst:
  profile: on-prem-strict
