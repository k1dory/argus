---
# Порядок: код → тома данных → .env (секреты генерирует хост) → make up → ожидание консоли.
# Все шаги идемпотентны: повторный прогон обновляет код и перезапускает только
# изменившиеся сервисы; .env существующие значения не трогает.

- name: Проверить входные переменные
  ansible.builtin.assert:
    that:
      - argus_source in ['git', 'local']
      - argus_source != 'local' or argus_local_src | length > 0
      - argus_images in ['build', 'registry']
      - argus_analyst_profile in ['mock', 'on-prem-strict']
      - argus_analyst_profile != 'on-prem-strict' or ('ARGUS_LLM_LOCAL_ENDPOINT' in argus_env)
    fail_msg: >-
      argus_source: git|local; при local нужен argus_local_src; профиль on-prem-strict
      требует ARGUS_LLM_LOCAL_ENDPOINT в argus_env.

- name: Пакеты для скриптов стека
  ansible.builtin.apt:
    name: [git, make, jq, curl, openssl, rsync]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Убедиться, что Docker с плагином compose на месте
  ansible.builtin.command: docker compose version
  changed_when: false

- name: Каталог стека
  ansible.builtin.file:
    path: "{{ argus_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Каталог без .git при argus_source git
  ansible.builtin.stat:
    path: "{{ argus_dir }}/.git"
  register: argus_gitdir
  when: argus_source == 'git'

# Переход с rsync-копии на git: превратить каталог в checkout, не теряя .env и тома.
- name: "Код: каталог из rsync → git checkout (.env сохраняется)"
  ansible.builtin.shell:
    cmd: >-
      set -e; cd {{ argus_dir | quote }};
      [ -z "$(ls -A)" ] && exit 0;
      git init -q; git remote add origin {{ argus_repo_url | quote }} 2>/dev/null || true;
      git fetch -q --tags origin; git reset -q --hard {{ argus_version | quote }}
    creates: "{{ argus_dir }}/.git"
  when: argus_source == 'git' and not argus_gitdir.stat.exists and argus_git_token | length == 0

- name: "Код: клон или обновление репозитория"
  ansible.builtin.git:
    repo: "{{ argus_repo_url if argus_git_token | length == 0
              else argus_repo_url | regex_replace('^https://', 'https://x-access-token:' ~ argus_git_token ~ '@') }}"
    dest: "{{ argus_dir }}"
    version: "{{ argus_version }}"
    force: false
    update: true
  when: argus_source == 'git'
  register: argus_git
  no_log: "{{ argus_git_token | length > 0 }}"

# Роль выставляет скриптам исполняемые биты; без этого git считал бы смену режима
# локальной правкой и на следующем прогоне отказывался обновлять checkout
# («Local modifications exist»).
- name: "Код: git не следит за режимами файлов в каталоге стека"
  ansible.builtin.command:
    cmd: git config core.fileMode false
    chdir: "{{ argus_dir }}"
  when: argus_source == 'git'
  changed_when: false

- name: "Код: rsync рабочей копии с управляющей машины"
  ansible.posix.synchronize:
    src: "{{ argus_local_src | regex_replace('/*$', '') }}/"
    dest: "{{ argus_dir }}/"
    archive: true
    delete: false
    delay_updates: false   # несовместимо с --inplace
    # --inplace: identities.yml и cmdb.yml примонтированы в контейнер движка как файлы;
    # обычный rsync пишет во временный файл и переименовывает, контейнер остаётся со старым inode.
    rsync_opts: "{{ ['--omit-dir-times', '--no-perms', '--inplace', '--chmod=Du+rwx,go+rx,Fu+rw,go+r']
                    + (argus_rsync_excludes | map('regex_replace', '^(.*)$', '--exclude=\\1') | list) }}"
  when: argus_source == 'local'
  register: argus_sync

- name: Исполняемые биты скриптов
  ansible.builtin.file:
    path: "{{ argus_dir }}/{{ item }}"
    mode: "0755"
  loop:
    - scripts/argus
    - scripts/init-storage.sh
    - scripts/backup.sh
    - scripts/restore.sh
    - scripts/migrate.sh
    - scripts/e2e.sh
    - scripts/api-smoke.sh
    - scripts/telemetry-sample.sh
    - scripts/gen-sample.sh
    - scripts/bench-ingest.sh

# Боевые карты идентичностей и CMDB живут вне checkout: git reset по тегу их не трогает,
# а compose подхватывает docker-compose.override.yml сам. Запись in-place (unsafe_writes):
# файлы примонтированы в движок как файлы, новый inode контейнер бы не увидел; содержимое
# движок перечитывает по mtime, пересоздание нужно только при смене самого монтирования —
# его делает docker compose up по изменившемуся override.
- name: Каталог боевых конфигов
  ansible.builtin.file:
    path: "{{ argus_etc_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: argus_identities_src | length > 0 or argus_cmdb_src | length > 0

- name: Карты идентичностей и CMDB с управляющей машины
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ argus_etc_dir }}/{{ item.name }}"
    owner: root
    group: root
    mode: "0644"
    unsafe_writes: true
  loop:
    - { name: identities.yml, src: "{{ argus_identities_src }}" }
    - { name: cmdb.yml, src: "{{ argus_cmdb_src }}" }
  loop_control:
    label: "{{ item.name }}"
  when: item.src | length > 0

- name: docker-compose.override.yml — боевые файлы вместо демо в движке
  ansible.builtin.template:
    src: docker-compose.override.yml.j2
    dest: "{{ argus_dir }}/docker-compose.override.yml"
    owner: root
    group: root
    mode: "0644"
  when: argus_identities_src | length > 0 or argus_cmdb_src | length > 0

- name: Тома данных ClickHouse на отдельном каталоге
  ansible.builtin.command:
    cmd: ./scripts/init-storage.sh {{ argus_data_dir | quote }} {{ argus_backup_dir | quote }}
    chdir: "{{ argus_dir }}"
  register: argus_storage
  changed_when: "'→' in argus_storage.stdout"
  when: argus_data_dir | length > 0

- name: ".env: секреты и состав стека (существующие значения не меняются)"
  ansible.builtin.command:
    cmd: >-
      ./scripts/argus init --no-up
      {{ '--with-wazuh' if argus_with_wazuh else '--without-wazuh' }}
      --analyst {{ argus_analyst_profile | quote }}
    chdir: "{{ argus_dir }}"
  register: argus_init
  changed_when: "'init:' in argus_init.stdout"

- name: ".env: дополнительные переменные"
  ansible.builtin.lineinfile:
    path: "{{ argus_dir }}/.env"
    regexp: "^#?{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    mode: "0600"
  loop: "{{ argus_env | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: ".env: профиль compose mcp"
  ansible.builtin.lineinfile:
    path: "{{ argus_dir }}/.env"
    regexp: "^#?COMPOSE_PROFILES="
    line: "COMPOSE_PROFILES={{ ((['wazuh'] if argus_with_wazuh else []) + ['mcp']) | join(',') }}"
    mode: "0600"
  when: argus_enable_mcp

- name: ".env: образы из реестра и ключ подписи"
  ansible.builtin.lineinfile:
    path: "{{ argus_dir }}/.env"
    regexp: "^#?{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    mode: "0600"
  loop:
    - { key: ARGUS_IMAGE_PREFIX, value: "{{ argus_image_prefix }}" }
    - { key: COSIGN_PUBKEY, value: "{{ './cosign.pub' if argus_verify_signatures else '' }}" }
  loop_control:
    label: "{{ item.key }}"
  when: argus_images == 'registry'

- name: cosign для проверки подписей образов
  ansible.builtin.get_url:
    url: "https://github.com/sigstore/cosign/releases/download/{{ argus_cosign_version }}/cosign-linux-amd64"
    dest: /usr/local/bin/cosign
    checksum: "sha256:{{ argus_cosign_sha256 }}"
    mode: "0755"
  when: argus_images == 'registry' and argus_verify_signatures

- name: Вход в реестр образов
  ansible.builtin.command:
    cmd: docker login {{ argus_registry | quote }} -u {{ argus_registry_user | quote }} --password-stdin
    stdin: "{{ argus_registry_token }}"
  when: argus_images == 'registry' and argus_registry_token | length > 0
  changed_when: false
  no_log: true

# Миграции идут одноразовым сервисом migrator (scripts/migrate.sh) внутри make deploy /
# make up: compose запускает его на каждом up, остальные сервисы ждут его успеха. Подъём
# стека и проверка migrator — блоки с общим rescue: при отказе (compose падает раньше
# проверки) rescue печатает код выхода и хвост лога migrator и роняет прогон. В логе clickhouse-
# client печатает упавший запрос целиком — ALTER USER … BY '<хеш>' SALT '<соль>' из
# migrate.sh, поэтому значения после BY и SALT маскируются до вывода. Пароль админа
# ClickHouse берётся из окружения контейнера clickhouse, в argv и вывод не попадает.
# timeout на пробах: retries/delay не прерывают зависший docker exec.
- name: Поднять стек
  block:
    - name: Собрать и поднять стек (первый прогон собирает образы, это долго)
      ansible.builtin.command:
        cmd: make up
        chdir: "{{ argus_dir }}"
      async: "{{ argus_up_timeout_sec }}"
      poll: 15
      register: argus_up
      changed_when: "'Started' in argus_up.stdout or 'Created' in argus_up.stdout or 'Recreated' in argus_up.stdout"
      when: argus_images == 'build'

    - name: Проверить подписи, выкачать образы релиза и поднять стек без сборки
      ansible.builtin.command:
        cmd: make deploy
        chdir: "{{ argus_dir }}"
      async: "{{ argus_up_timeout_sec }}"
      poll: 15
      register: argus_deploy
      changed_when: "'Started' in argus_deploy.stdout or 'Created' in argus_deploy.stdout or 'Recreated' in argus_deploy.stdout or 'Pulled' in argus_deploy.stdout"
      when: argus_images == 'registry'
  rescue: &argus_migrator_rescue
    # SQL из лога не выводится вовсе: clickhouse-client печатает упавший запрос целиком
    # (ALTER USER … BY '<хеш>' SALT '<соль>', PASSWORD словаря), а надёжно замаскировать
    # литералы SQL нельзя. Свободный текст тоже не выводится — ни исключения (throwIf с
    # произвольным сообщением), ни строк после него. migrate.sh падает на первой ошибке
    # (set -e), поэтому после первой «Code: N. DB::Exception:» прогона его собственных
    # сообщений нет: всё до начала следующего прогона («migrate: waiting for clickhouse»)
    # — продолжение исключения или SQL и отбрасывается, даже если похоже на «migrate: …».
    # Выводятся: код выхода, имя файла миграции (только вида 0031_имя.sql), отказ
    # migrate.sh с именами переменных CLICKHOUSE_*, код ошибки и имена исключений
    # ClickHouse (UPPER_SNAKE). Полный лог — на хосте, команда в сообщении.
    - name: "Миграции: код выхода migrator и причина отказа (без SQL)"
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          id="$(docker compose ps -aq migrator)"
          [ -n "$id" ] && echo "migrator: код $(docker inspect -f '{{ '{{' }}.State.ExitCode{{ '}}' }}' "$id")"
          docker compose logs --no-color --tail=400 migrator 2>&1 | awk '
            function names(text,    out, n, i, w, words) {
              out = ""; n = split(text, words, /[^A-Za-z0-9_]+/)
              for (i = 1; i <= n; i++) {
                w = words[i]
                if (w ~ /^[A-Z][A-Z0-9_]*_[A-Z0-9_]+$/ && length(w) <= 64 && index(" " out " ", " " w " ") == 0) out = out (out == "" ? "" : " ") w
              }
              return out
            }
            { sub(/^[^|]*\| ?/, "") }
            /^migrate: waiting for clickhouse/ { apply = ""; refusal = ""; code = ""; failed = 0; next }
            failed { next }
            /^migrate: apply / {
              file = substr($0, 16)
              apply = (file ~ /^[0-9][0-9][0-9][0-9]_[a-z0-9_]+\.sql$/) ? "migrate: apply " file : "migrate: apply <имя файла скрыто>"
              next
            }
            /^migrate: ОТКАЗ/ { refusal = "migrate: ОТКАЗ — дефолтные пароли: " names($0); next }
            /^Code: [0-9]+\. DB::Exception:/ {
              split($0, head, ".")
              code = head[1]; n = names(substr($0, length(head[1]) + 2))
              if (n != "") code = code " (" n ")"
              failed = 1
            }
            END {
              if (apply != "") print apply
              if (refusal != "") print refusal
              if (code != "") print code
            }'
        executable: /bin/bash
        chdir: "{{ argus_dir }}"
      register: argus_migrator_log
      changed_when: false
      failed_when: false
      timeout: "{{ argus_probe_timeout_sec }}"

    - name: "Выкатка не удалась"
      ansible.builtin.fail:
        msg: >-
          Подъём стека или миграции не удались («{{ ansible_failed_task.name | default('?') }}»).
          migrator: {{ argus_migrator_log.stdout_lines | default([]) | join(' / ') }}.
          Полный лог (содержит SQL с хешами паролей, в тикеты и чаты не копировать):
          cd {{ argus_dir }} && docker compose logs migrator

- name: Проверить миграции
  block:
    - name: "Миграции: migrator завершился успешно"
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          id="$(docker compose ps -aq migrator)"
          test -n "$id" || { echo "контейнер migrator не найден"; exit 1; }
          code="$(docker inspect -f '{{ '{{' }}.State.ExitCode{{ '}}' }}' "$id")"
          if [ "$code" != 0 ]; then echo "migrator: код $code"; exit 1; fi
          docker compose exec -T clickhouse sh -c 'clickhouse-client --user "$CLICKHOUSE_USER"' <<'SQL'
          SELECT max(name) FROM argus.schema_migrations
          SQL
        executable: /bin/bash
        chdir: "{{ argus_dir }}"
      register: argus_migrations
      changed_when: false
      timeout: "{{ argus_probe_timeout_sec }}"
  rescue: *argus_migrator_rescue

- name: "Миграции: последняя применённая"
  ansible.builtin.debug:
    msg: "{{ argus_migrations.stdout | default('') | trim }}"

# По имени, а не по 127.0.0.1: клиент без SNI получает сертификат default_sni
# (CONSOLE_HOST), а для имени localhost Caddy выпускает свой всегда.
# Файлы карты идентичностей и CMDB примонтированы в контейнер движка как файлы:
# если их inode сменился (новый файл, rsync без --inplace), контейнер видит старую
# версию до пересоздания. При изменении этих файлов пересоздаём движок.
# APP_VERSION из VERSION, как в Makefile: без него compose подставит тег dev и соберёт
# движок на хосте вместо подписанного образа релиза.
- name: Пересоздать движок после смены identities.yml или cmdb.yml
  ansible.builtin.shell:
    cmd: APP_VERSION="$(cat VERSION)" docker compose up -d --force-recreate --no-deps {{ '--no-build' if argus_images == 'registry' else '' }} engine
    chdir: "{{ argus_dir }}"
  when: >-
    (argus_sync.stdout_lines | default([]) | select('search', '(identities|cmdb)\.yml') | list | length > 0)
    or (argus_git is defined and argus_git.changed | default(false))
  changed_when: true

# Строка «незавершённых|частей к обработке|причина сбоя» (причина пуста — сбоя нет).
- name: "Миграции: дождаться фоновых мутаций (MATERIALIZE)"
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      docker compose exec -T clickhouse sh -c 'clickhouse-client --user "$CLICKHOUSE_USER" --format TSVRaw' <<'SQL'
      SELECT concat(toString(countIf(NOT is_done)), '|', toString(sumIf(parts_to_do, NOT is_done)), '|',
                    anyIf(concat(table, ': ', latest_fail_reason), NOT is_done AND latest_fail_reason != ''))
      FROM system.mutations WHERE database = 'argus'
      SQL
    executable: /bin/bash
    chdir: "{{ argus_dir }}"
  register: argus_mutations
  changed_when: false
  timeout: "{{ argus_probe_timeout_sec }}"
  retries: "{{ argus_mutations_retries }}"
  delay: "{{ argus_mutations_delay_sec }}"
  until: >-
    argus_mutations.rc == 0 and
    ((argus_mutations.stdout.split('|', 2) + ['', '', ''])[0] | trim == '0'
     or (argus_mutations.stdout.split('|', 2) + ['', '', ''])[2] | trim | length > 0)
  failed_when: >-
    argus_mutations.rc != 0
    or (argus_mutations.stdout.split('|', 2) + ['', '', ''])[0] | trim != '0'

- name: Дождаться консоли
  ansible.builtin.uri:
    url: https://localhost:8443/api/version
    validate_certs: false
    status_code: 200
  register: argus_ready
  retries: "{{ argus_ready_retries }}"
  delay: "{{ argus_ready_delay_sec }}"
  until: argus_ready.status == 200

- name: Дождаться коллектора
  ansible.builtin.uri:
    url: http://127.0.0.1:8088/healthz
    status_code: 200
  register: argus_collector_ready
  retries: 12
  delay: 5
  until: argus_collector_ready.status == 200

- name: Резервные копии по cron
  ansible.builtin.cron:
    name: argus backup
    user: root
    hour: "{{ argus_backup_cron_hour }}"
    minute: "{{ argus_backup_cron_minute }}"
    job: "cd {{ argus_dir }} && ./scripts/backup.sh >> /var/log/argus-backup.log 2>&1"
    state: "{{ 'present' if argus_backup_cron else 'absent' }}"

- name: Что дальше
  ansible.builtin.debug:
    msg:
      - "Консоль: https://{{ ansible_host | default(inventory_hostname) }}:8443 (внутренний CA Caddy — предупреждение браузера ожидаемо)"
      - "Пароль admin: docker compose --project-directory {{ argus_dir }} exec web cat /data/admin-password.txt"
      - "Проверка API: cd {{ argus_dir }} && ./scripts/api-smoke.sh"
      - "Демо-данные: cd {{ argus_dir }} && make demo"
      - "Источники: syslog :5514, TLS :6514, NetFlow :2055/udp, вебхуки и NDJSON https://…:8089/ingest/* с X-Argus-Token из .env"
