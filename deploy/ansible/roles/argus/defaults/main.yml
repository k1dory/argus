---
# Роль argus: развернуть стек ARGUS (docker compose) на хосте с Docker.
# Хост уже подготовлен: Ubuntu 24.04 или Debian 12/13, docker-ce с плагином
# compose, sudo без пароля у пользователя Ansible. Что роль НЕ делает:
# не ставит Docker, не настраивает фаервол и sshd — это роли вашей инфраструктуры.

# Откуда брать код. git — клон репозитория (публичный или с deploy-ключом на хосте);
# local — rsync рабочей копии с управляющей машины (для приватного репозитория
# или стенда без доступа к Git-серверу).
argus_source: git                       # git | local
argus_repo_url: https://github.com/k1dory/argus.git
argus_version: opensource               # ветка или тег (для образов из реестра — тег релиза vX.Y.Z)
argus_local_src: ""                     # при argus_source: local — путь к checkout на управляющей машине
argus_git_token: ""                     # приватный репозиторий: токен с правом чтения кода (в URL, не в логах)

# Образы: build — собирать на хосте (make up); registry — брать из реестра релиза
# (make deploy: cosign verify → pull → up без сборки). Версия образов = файл VERSION
# в выкачанном коде, поэтому argus_version должен указывать на тег релиза.
argus_images: build                     # build | registry
argus_image_prefix: ghcr.io/k1dory/argus
argus_registry: ghcr.io
argus_registry_user: ""                 # docker login; для GHCR — логин GitHub
argus_registry_token: ""                # токен с правом read:packages (приватные пакеты); пусто — без логина
argus_verify_signatures: true           # cosign verify --key cosign.pub из репозитория перед pull
argus_cosign_version: v3.1.4
argus_cosign_sha256: "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa"   # cosign-linux-amd64

argus_dir: /opt/argus                   # куда кладётся код и .env
argus_data_dir: /srv/argus              # данные ClickHouse (scripts/init-storage.sh); "" — тома compose по умолчанию
argus_backup_dir: "{{ argus_data_dir }}/backups"

# Состав стека.
argus_with_wazuh: false                 # модуль Wazuh: shipper, policyd, разделы консоли
argus_analyst_profile: mock             # mock | on-prem-strict (нужен ARGUS_LLM_LOCAL_ENDPOINT)
argus_enable_mcp: false                 # профиль compose mcp (argus-mcp по HTTP на 127.0.0.1:18095)

# Дополнительные переменные .env (ключ: значение). Секреты сюда не класть —
# их генерирует `scripts/argus init` прямо на хосте. Примеры:
#   ARGUS_LLM_LOCAL_ENDPOINT: https://llm.example.org/v1
#   CONSOLE_TLS: "/certs/console.crt /certs/console.key"
#   SYSLOG_TLS_ADDR: ":6514"
argus_env: {}

# Боевые identities.yml и cmdb.yml вне checkout: файлы с управляющей машины кладутся в
# argus_etc_dir на хосте и подменяют демо-файлы репозитория через docker-compose.override.yml
# (make up / make deploy зовут docker compose без -f, override подхватывается сам).
# Пусто — остаются файлы из репозитория (демо-персоны и демо-узлы).
argus_identities_src: ""
argus_cmdb_src: ""
argus_etc_dir: /etc/argus

# Резервные копии: scripts/backup.sh по cron от root.
argus_backup_cron: true
argus_backup_cron_hour: "3"
argus_backup_cron_minute: "0"

# Сколько ждать `make up` (сборка образов на первом прогоне идёт долго) и старт консоли.
argus_up_timeout_sec: 1800
argus_ready_retries: 60
argus_ready_delay_sec: 10

# Что исключить при rsync рабочей копии (argus_source: local).
argus_rsync_excludes:
  - .git
  - .env
  - .env.ai
  - web/node_modules
  - web/.next
  - web/.auth.json
  - shipper/target
  - bin
  - backups
  - .claude
  - "caddy/certs/*"
  - "collector/certs/*"
