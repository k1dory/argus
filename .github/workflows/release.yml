# Релиз ARGUS по тегу vX.Y.Z: образы всех сервисов в GitHub Container Registry
# (ghcr.io/<owner>/<repo>/<service>) с тегом версии и latest, бинарники MCP-сервера
# под все ОС, релиз GitHub с заметками из CHANGELOG. Каждый образ до push проходит
# trivy (HIGH/CRITICAL — блокирует), после push подписывается cosign (если задан
# секрет COSIGN_PRIVATE_KEY). Оператор проверяет подпись при `make deploy`
# (COSIGN_PUBKEY в .env), ARGUS_IMAGE_PREFIX=ghcr.io/<owner>/<repo>.
#
# Секреты: GITHUB_TOKEN (встроенный, push в ghcr.io и релиз); опционально
# COSIGN_PRIVATE_KEY (PEM, cosign generate-key-pair) и COSIGN_PASSWORD.
# Actions пришпилены по SHA (см. ci.yml).
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PREFIX: ghcr.io/${{ github.repository }}

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: тег совпадает с VERSION
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"; ver="$(cat VERSION)"
          [ "$tag" = "$ver" ] || { echo "тег v$tag, а VERSION=$ver"; exit 1; }
          # Заголовок сравнивается строкой: версия — не регулярное выражение.
          awk -v h="## $ver — " 'index($0, h) == 1 { found = 1 } END { exit !found }' CHANGELOG.md \
            || { echo "в CHANGELOG.md нет раздела $ver"; exit 1; }
          # Любой файл в changes/unreleased, кроме README.md (скрытый, вложенный), — несобранный
          # фрагмент. Имена не печатаются: строка из имени файла стала бы командой раннера.
          # Корень-симлинк спрятал бы фрагменты от find, ошибка обхода — тоже: оба — отказ.
          set -o pipefail
          for d in changes changes/unreleased; do
            [ ! -L "$d" ] || { echo "$d — симлинк; changelog-фрагменты не проверены"; exit 1; }
          done
          left=0
          if [ -e changes/unreleased ]; then
            left="$(find changes/unreleased -mindepth 1 ! -type d ! -path changes/unreleased/README.md -print0 | tr -cd '\0' | wc -c)" \
              || { echo "не удалось обойти changes/unreleased"; exit 1; }
          fi
          [ "$left" -eq 0 ] || { echo "несобранных фрагментов changelog: $left — запустите scripts/changelog-release.sh $ver"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"

  images:
    runs-on: ubuntu-latest
    needs: check-version
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        service: [shipper, policyd, collector, engine, web, mcp]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 1. Сборка в локальный docker (без push) — сканируем до публикации.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./${{ matrix.service }}
          # mcp: общий модуль triage/ (COPY --from=triage, replace ../triage).
          # Остальным сервисам именованный контекст не мешает.
          build-contexts: triage=./triage
          load: true
          build-args: |
            APP_VERSION=${{ needs.check-version.outputs.version }}
          tags: ${{ env.PREFIX }}/${{ matrix.service }}:${{ needs.check-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      # 2. trivy: HIGH/CRITICAL с доступным исправлением — релиз не выходит.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.PREFIX }}/${{ matrix.service }}:${{ needs.check-version.outputs.version }}
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
      # 3. Push (сборка из кэша) с тегами версии и latest.
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./${{ matrix.service }}
          # mcp: общий модуль triage/ (COPY --from=triage, replace ../triage).
          # Остальным сервисам именованный контекст не мешает.
          build-contexts: triage=./triage
          push: true
          build-args: |
            APP_VERSION=${{ needs.check-version.outputs.version }}
          tags: |
            ${{ env.PREFIX }}/${{ matrix.service }}:${{ needs.check-version.outputs.version }}
            ${{ env.PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha
          provenance: false
      # 4. Подпись по digest (если задан ключ). Проверка: cosign verify --key cosign.pub <image>.
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: cosign sign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then echo "COSIGN_PRIVATE_KEY не задан — образ не подписан"; exit 0; fi
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${PREFIX}/${{ matrix.service }}@${{ steps.push.outputs.digest }}"

  mcp-binaries:
    runs-on: ubuntu-latest
    needs: check-version
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          check-latest: true   # свежий патч Go: govulncheck блокирует уязвимости stdlib (GO-2026-6809 в 1.26.9)
          cache-dependency-path: mcp/go.sum
      - name: сборка под все ОС
        run: |
          set -e; mkdir -p dist; v="${GITHUB_REF_NAME#v}"
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${t%/*}"; arch="${t#*/}"; ext=""; [ "$os" = windows ] && ext=".exe"
            (cd mcp && CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$v" -o "../dist/argus-mcp_${v}_${os}_${arch}${ext}" .)
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: argus-mcp
          path: dist/*

  release:
    runs-on: ubuntu-latest
    needs: [images, mcp-binaries]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: argus-mcp
          path: dist
      - name: заметки из CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{p = ($2 == v)} p' CHANGELOG.md > notes.md
          printf '\nОбразы: `%s/<service>:%s` (shipper, policyd, collector, engine, web, mcp); подпись cosign при заданном COSIGN_PRIVATE_KEY.\n' "$PREFIX" "$v" >> notes.md
      - name: релиз GitHub
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          body_path: notes.md
          files: dist/*
          tag_name: ${{ github.ref_name }}
