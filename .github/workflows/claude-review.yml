# Необязательное ревью PR в main внешним LLM-ревьюером (GitHub Actions).
# Выключено по умолчанию: включается переменной репозитория CLAUDE_REVIEW=true
# (Settings → Variables) и одним из секретов ANTHROPIC_API_KEY или
# CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`) плюс установленным
# GitHub App ревьюера: https://github.com/apps/claude. Без переменной job не запускается.
# Actions пришпилены по SHA коммита (комментарий — версия), как в ci.yml и release.yml.
name: claude-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Черновики не ревьюим; у PR из форков нет доступа к секретам.
    if: >-
      vars.CLAUDE_REVIEW == 'true' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.sha }}
            HEAD: ${{ github.event.pull_request.head.sha }}

            Проведи ревью этого PR в ARGUS. Пиши по-русски.

            Сначала прочитай CONTRIBUTING.md и SECURITY.md, затем diff
            (`gh pr diff`) и при необходимости окружающий код в репозитории.

            Ищи в первую очередь реальные дефекты, а не стиль:
            - потеря или дублирование событий при приёме, в spool, батчерах,
              при остановке коллектора и записи в ClickHouse;
            - гонки и утечки горутин, игнорируемые ошибки и неполное чтение
              HTTP-ответов, отменённые контексты;
            - авторизация, сессии, TOTP, реагирование (блокировки IP),
              инъекции в запросы ClickHouse, секреты в коде и фикстурах;
            - совместимость обновления: миграции ClickHouse только новыми
              идемпотентными файлами, уже применённые не редактируются;
            - CI и релиз: новые компоненты в матрицах, согласованность версий;
            - отсутствие теста на изменённое поведение, README/CHANGELOG
              при изменении настроек или поведения для пользователя.

            Для каждой проблемы оставь inline-комментарий
            (mcp__github_inline_comment__create_inline_comment) с приоритетом
            P1 (потеря данных, безопасность, падение) или P2 (прочие ошибки),
            условием воспроизведения и предлагаемым исправлением. Не
            комментируй то, в чём не уверен, и не пиши похвалу.

            В конце оставь один общий комментарий (`gh pr comment`): краткая
            таблица найденного по приоритетам или «Блокирующих замечаний нет».

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob"
